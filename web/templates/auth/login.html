{% extends "base.html" %}

{% block title %}Вход — Marketplace Sync{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-2rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Логотип и заголовок -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-100 text-brand-600 mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Marketplace Sync</h1>
            <p class="mt-1 text-sm text-slate-500">Войдите в свой аккаунт</p>
        </div>

        <!-- Карточка формы -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <!-- Сообщение об ошибке -->
            {% if error %}
            <div class="mb-6 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-2">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Форма -->
            <form method="POST" action="/auth/login" class="space-y-5">
                <input type="hidden" name="next" value="{{ next_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Email
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="user@example.com"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                </div>

                <!-- Пароль -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Пароль
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="Минимум 8 символов"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                </div>

                <!-- Кнопка входа -->
                <button
                    type="submit"
                    class="w-full py-2.5 px-4 bg-brand-600 text-white font-semibold rounded-lg
                           hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50
                           transition-colors text-sm"
                >
                    Войти
                </button>
            </form>
        </div>

        <!-- Ссылка на регистрацию -->
        {% if registration_open %}
        <p class="mt-6 text-center text-sm text-slate-500">
            Нет аккаунта?
            <a href="/auth/register" class="text-brand-600 font-medium hover:text-brand-700 hover:underline transition-colors">
                Создать аккаунт
            </a>
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
