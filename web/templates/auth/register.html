{% extends "base.html" %}

{% block title %}Регистрация — Marketplace Sync{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-2rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Логотип и заголовок -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-100 text-brand-600 mb-4">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Создать аккаунт</h1>
            <p class="mt-1 text-sm text-slate-500">Заполните форму для регистрации</p>
        </div>

        <!-- Карточка формы -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            <!-- Сообщение об ошибке -->
            {% if error %}
            <div class="mb-6 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-2">
                <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Форма -->
            <form method="POST" action="/auth/register" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Email <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="user@example.com"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                </div>

                <!-- Отображаемое имя -->
                <div>
                    <label for="display_name" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Имя
                        <span class="text-slate-400 font-normal">(необязательно)</span>
                    </label>
                    <input
                        type="text"
                        id="display_name"
                        name="display_name"
                        autocomplete="name"
                        placeholder="Как вас называть"
                        maxlength="100"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                </div>

                <!-- Пароль -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Пароль <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="new-password"
                        placeholder="Минимум 8 символов"
                        minlength="8"
                        maxlength="72"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                    <p class="mt-1 text-xs text-slate-400">От 8 до 72 символов</p>
                </div>

                <!-- Подтверждение пароля -->
                <div>
                    <label for="password_confirm" class="block text-sm font-medium text-slate-700 mb-1.5">
                        Подтверждение пароля <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        required
                        autocomplete="new-password"
                        placeholder="Повторите пароль"
                        minlength="8"
                        maxlength="72"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                               placeholder:text-slate-400
                               focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500
                               transition-colors"
                    >
                </div>

                <!-- Кнопка регистрации -->
                <button
                    type="submit"
                    class="w-full py-2.5 px-4 bg-brand-600 text-white font-semibold rounded-lg
                           hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/50
                           transition-colors text-sm"
                >
                    Зарегистрироваться
                </button>
            </form>
        </div>

        <!-- Ссылка на вход -->
        <p class="mt-6 text-center text-sm text-slate-500">
            Уже есть аккаунт?
            <a href="/auth/login" class="text-brand-600 font-medium hover:text-brand-700 hover:underline transition-colors">
                Войти
            </a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Проверка совпадения паролей на клиенте (до отправки формы)
    const form = document.querySelector('form');
    const password = document.getElementById('password');
    const passwordConfirm = document.getElementById('password_confirm');

    form.addEventListener('submit', function(e) {
        if (password.value !== passwordConfirm.value) {
            e.preventDefault();
            passwordConfirm.setCustomValidity('Пароли не совпадают');
            passwordConfirm.reportValidity();
        } else {
            passwordConfirm.setCustomValidity('');
        }
    });

    // Сброс ошибки при вводе
    passwordConfirm.addEventListener('input', function() {
        if (password.value === passwordConfirm.value) {
            passwordConfirm.setCustomValidity('');
        }
    });
</script>
{% endblock %}
